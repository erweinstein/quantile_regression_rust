[package]
name = "quantile_regression"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
authors = ["Eliot R. Weinstein <eliotw@uchicago.edu>"]
description = "A Rust translation of the interior point quantile regression code of Koenker, Morillo and Eilers (rq.m, rqic.m) and Koenker and Park (ipqr.m), and Rust replication code for Arellano and Bonhomme (2017)"
repository = "https://github.com/erweinstein/quantile_regression_rust"
readme = "README.md"

[dependencies]
libm = "0.2"
rand = "0.8"
rand_xoshiro = "0.6"
rand_distr = "0.4"
rayon = "1.10"

[dev-dependencies]
rayon = "1.10"
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
