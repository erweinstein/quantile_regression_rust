[package]
name = "quantile_regression_py"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Eliot R. Weinstein <eliotw@uchicago.edu>"]
description = "Python bindings (PyO3) for the quantile_regression crate"
publish = false

[lib]
name = "quantile_regression_rs"
crate-type = ["cdylib"]

[dependencies]
quantile_regression = { path = ".." }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
numpy = "0.30"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
